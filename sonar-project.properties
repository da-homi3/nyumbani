# SonarQube / SonarCloud analysis scope for NyumbaSearch.
# Requires SONAR_HOST_URL + SONAR_TOKEN (or SONAR_TOKEN for SonarCloud).
# Run from repo root: npx sonar-scanner

sonar.projectKey=nyumbasearch
sonar.projectName=NyumbaSearch
sonar.sources=find-nyumba-smart/src/lib/api/mobile,flutter_app/lib
sonar.tests=flutter_app/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/.dart_tool/**,**/build/**,**/*.g.dart,**/*.freezed.dart
sonar.sourceEncoding=UTF-8

# TypeScript / JS (Worker mobile BFF)
sonar.typescript.tsconfigPath=find-nyumba-smart/tsconfig.json

# Flutter / Dart — analyzer quality gate is also enforced via `flutter analyze`
sonar.dart.analyzer.mode=flutter

name: nyumbasearch
description: NyumbaSearch native Flutter client — Tenant MVP (shares existing Supabase + Worker backend).
publish_to: "none"
version: 1.0.19+33

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^15.1.2
  supabase_flutter: ^2.9.0
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  logger: ^2.5.0
  equatable: ^2.0.7
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  permission_handler: ^13.0.0
  image_picker: ^1.2.3
  share_plus: ^12.0.2
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  webview_flutter: ^4.14.1
  file_picker: ^11.0.3
  mapbox_maps_flutter: ^2.28.0
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/env/
    - assets/brand/
